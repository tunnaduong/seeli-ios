name: Seeli
options:
  bundleIdPrefix: com.seeli
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  knownRegions: [vi, ja]
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Seeli:
    type: application
    platform: iOS
    sources:
      - path: Seeli
      - path: Shared
    dependencies:
      - target: SeeliWidget
    info:
      path: Seeli/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.tunnaduong.seeli
            CFBundleURLSchemes: [seeli]
        SEELIAPIURL: $(SEELI_API_URL)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Seeli/Seeli.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tunnaduong.seeli]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunnaduong.seeli
        SEELI_API_URL: https://seeli-api.tunnaduong.com
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SEELI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "SEELI dùng camera để bạn ghi lại những gì mình nhìn thấy và quét mã QR kết bạn."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "SEELI ghi lại nơi bạn chụp ảnh. Thông tin này chỉ lưu trong ký ức của riêng bạn."
        INFOPLIST_KEY_CFBundleAllowMixedLocalizations: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 62H5L8QDTS

  SeeliWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SeeliWidget
      - path: Shared
    info:
      path: SeeliWidget/Info.plist
      properties:
        CFBundleDisplayName: SEELI
        CFBundleAllowMixedLocalizations: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SeeliWidget/SeeliWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tunnaduong.seeli]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunnaduong.seeli.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 62H5L8QDTS
